services:
  trip-planner-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: helloagents-trip-planner-dev
    ports:
      - "7860:7860"   # 后端 API
      - "9000:9000"   # H5 HMR
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gpt-4}
      - LLM_TIMEOUT=600
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=7860
      - NODE_ENV=development
      - YOUBAN_DEV_WECHAT_AUTH=1
    volumes:
      # 挂载本地代码，支持热加载
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./shared/contracts:/app/shared/contracts
      - backend-node-modules:/app/backend/node_modules
      - frontend-node-modules:/app/frontend/node_modules
      - ./data:/app/data
    restart: unless-stopped

volumes:
  backend-node-modules:
  frontend-node-modules:
