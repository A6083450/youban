services:
  trip-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helloagents-trip-planner
    ports:
      - "7860:7860"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-gpt-4}
      - LLM_TIMEOUT=600
      - DATA_DIR=/app/data
      - HOST=0.0.0.0
      - PORT=7860
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    restart: unless-stopped
