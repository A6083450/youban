<!DOCTYPE html>

<style>
  body{margin:0;background:#FAF7F2;font-family:"SF Mono",Menlo,monospace;color:#3D3229;padding:30px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1000px;}
  .cell{background:#fffcf5;border:1px solid rgba(92,75,62,.14);border-radius:14px;padding:18px;text-align:center;}
  h3{font-size:12px;margin:0 0 12px;color:#C17F59;letter-spacing:.03em;}
  .big{width:130px;height:130px;margin:0 auto;color:#D4625E;}
  .big svg{width:100%;height:100%;display:block;}
  .row16{display:flex;gap:20px;justify-content:center;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(92,75,62,.2);}
  .s16{width:16px;height:16px;color:#D4625E;} .s16 svg{width:100%;height:100%;display:block;}
  .s24{width:24px;height:24px;color:#D4625E;} .s24 svg{width:100%;height:100%;display:block;}
  .s32{width:32px;height:32px;color:#D4625E;} .s32 svg{width:100%;height:100%;display:block;}
  .onwhite{background:#fff;border-radius:8px;padding:2px;}
  .lab{font-size:10px;color:#5C4B3E;margin-top:6px;}
  .desc{font-size:11px;color:#5C4B3E;margin-top:10px;line-height:1.5;}
  .tile{width:96px;height:96px;border-radius:22px;background:#D4625E;display:flex;align-items:center;justify-content:center;margin:14px auto 0;}
  .tile .m{width:64px;height:64px;color:#fffcf5;} .tile .m svg{width:100%;height:100%;display:block;}
