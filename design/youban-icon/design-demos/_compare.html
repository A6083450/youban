<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/>
<style>
  body{margin:0;background:#FAF7F2;font-family:"SF Mono",Menlo,monospace;color:#3D3229;padding:30px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;max-width:1200px;}
  .cell{background:#fffcf5;border:1px solid rgba(92,75,62,.14);border-radius:14px;padding:18px;text-align:center;}
  h3{font-size:13px;margin:0 0 12px;color:#C17F59;letter-spacing:.05em;}
  .big{width:120px;height:120px;margin:0 auto;color:#D4625E;}
  .big svg{width:100%;height:100%;display:block;}
  .row16{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(92,75,62,.2);}
  .s16{width:16px;height:16px;color:#D4625E;} .s16 svg{width:100%;height:100%;display:block;}
  .s24{width:24px;height:24px;color:#D4625E;} .s24 svg{width:100%;height:100%;display:block;}
  .s32{width:32px;height:32px;color:#D4625E;} .s32 svg{width:100%;height:100%;display:block;}
  .lab{font-size:10px;color:#5C4B3E;margin-top:6px;}
  .desc{font-size:11px;color:#5C4B3E;margin-top:10px;line-height:1.5;}
</style></head><body>
<div class="grid">

  <!-- A: 当前 fat-m (参照/淘汰) -->
  <div class="cell">
    <h3>A · 当前双拱 (读作 m)</h3>
    <div class="big"><svg viewBox="0 0 512 512"><path d="M95 350 C135 306 133 184 181 182 C217 181 229 272 245 272 C269 272 285 156 315 156 C365 156 395 286 417 318" fill="none" stroke="currentColor" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="row16">
      <div><div class="s32"><svg viewBox="0 0 512 512"><path d="M95 350 C135 306 133 184 181 182 C217 181 229 272 245 272 C269 272 285 156 315 156 C365 156 395 286 417 318" fill="none" stroke="currentColor" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab">32</div></div>
      <div><div class="s16"><svg viewBox="0 0 512 512"><path d="M95 350 C135 306 133 184 181 182 C217 181 229 272 245 272 C269 272 285 156 315 156 C365 156 395 286 417 318" fill="none" stroke="currentColor" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab">16</div></div>
    </div>
    <div class="desc">淘汰：像字母 m，无路感、无人感。</div>
  </div>

  <!-- B: 两个立形(头+身)依偎 + 锥形路 -->
  <div class="cell">
    <h3>B · 二立形 + 锥形路</h3>
    <div class="big"><svg viewBox="0 0 512 512">
      <!-- 锥形路(近宽远窄，微弧) -->
      <path d="M84 344 Q256 322 430 336 Q432 350 428 356 Q256 344 92 366 Q82 356 84 344 Z" fill="currentColor"/>
      <!-- 图形A 左，略矮，右倾 -->
      <path d="M196 214 q34 0 34 40 l-6 74 q-1 12 -28 12 q-27 0 -28 -12 l-6 -74 q0 -40 34 -40 z" fill="currentColor"/>
      <!-- 图形B 右，略高，左倾 -->
      <path d="M300 186 q40 0 40 46 l-8 86 q-1 12 -32 12 q-31 0 -32 -12 l-8 -86 q0 -46 40 -46 z" fill="currentColor"/>
    </svg></div>
    <div class="row16">
      <div><div class="s32"><svg viewBox="0 0 512 512"><path d="M84 344 Q256 322 430 336 Q432 350 428 356 Q256 344 92 366 Q82 356 84 344 Z" fill="currentColor"/><path d="M196 214 q34 0 34 40 l-6 74 q-1 12 -28 12 q-27 0 -28 -12 l-6 -74 q0 -40 34 -40 z" fill="currentColor"/><path d="M300 186 q40 0 40 46 l-8 86 q-1 12 -32 12 q-31 0 -32 -12 l-8 -86 q0 -46 40 -46 z" fill="currentColor"/></svg></div><div class="lab">32</div></div>
      <div><div class="s16"><svg viewBox="0 0 512 512"><path d="M84 344 Q256 322 430 336 Q432 350 428 356 Q256 344 92 366 Q82 356 84 344 Z" fill="currentColor"/><path d="M196 214 q34 0 34 40 l-6 74 q-1 12 -28 12 q-27 0 -28 -12 l-6 -74 q0 -40 34 -40 z" fill="currentColor"/><path d="M300 186 q40 0 40 46 l-8 86 q-1 12 -32 12 q-31 0 -32 -12 l-8 -86 q0 -46 40 -46 z" fill="currentColor"/></svg></div><div class="lab">16</div></div>
    </div>
    <div class="desc">两个竖立形=两人；锥形路=旅程。</div>
  </div>

  <!-- C: 两个头(圆) + 弧路 -->
  <div class="cell">
    <h3>C · 二头(圆) + 弧路</h3>
    <div class="big"><svg viewBox="0 0 512 512">
      <path d="M92 330 Q256 300 424 330" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"/>
      <circle cx="220" cy="238" r="54" fill="currentColor"/>
      <circle cx="306" cy="222" r="64" fill="currentColor"/>
    </svg></div>
    <div class="row16">
      <div><div class="s32"><svg viewBox="0 0 512 512"><path d="M92 330 Q256 300 424 330" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"/><circle cx="220" cy="238" r="54" fill="currentColor"/><circle cx="306" cy="222" r="64" fill="currentColor"/></svg></div><div class="lab">32</div></div>
      <div><div class="s16"><svg viewBox="0 0 512 512"><path d="M92 330 Q256 300 424 330" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round"/><circle cx="220" cy="238" r="54" fill="currentColor"/><circle cx="306" cy="222" r="64" fill="currentColor"/></svg></div><div class="lab">16</div></div>
    </div>
    <div class="desc">两圆=两头/人；弧线=路。防笑脸：两圆靠近、路偏平。</div>
  </div>

  <!-- D: 单线 — 路升起成两个头肩人形(填充剪影，平底路) -->
  <div class="cell">
    <h3>D · 单形剪影(平底路+双人)</h3>
    <div class="big"><svg viewBox="0 0 512 512">
      <path d="M96 342
               Q96 330 112 328
               Q150 324 168 300
               Q182 210 232 208
               Q276 210 268 268
               Q262 300 288 302
               Q300 302 306 288
               Q316 182 366 184
               Q404 188 402 300
               Q404 322 420 326
               Q436 330 434 344
               Q432 360 414 360
               L118 360
               Q98 360 96 342 Z" fill="currentColor"/>
    </svg></div>
    <div class="row16">
      <div><div class="s32"><svg viewBox="0 0 512 512"><path d="M96 342 Q96 330 112 328 Q150 324 168 300 Q182 210 232 208 Q276 210 268 268 Q262 300 288 302 Q300 302 306 288 Q316 182 366 184 Q404 188 402 300 Q404 322 420 326 Q436 330 434 344 Q432 360 414 360 L118 360 Q98 360 96 342 Z" fill="currentColor"/></svg></div><div class="lab">32</div></div>
      <div><div class="s16"><svg viewBox="0 0 512 512"><path d="M96 342 Q96 330 112 328 Q150 324 168 300 Q182 210 232 208 Q276 210 268 268 Q262 300 288 302 Q300 302 306 288 Q316 182 366 184 Q404 188 402 300 Q404 322 420 326 Q436 330 434 344 Q432 360 414 360 L118 360 Q98 360 96 342 Z" fill="currentColor"/></svg></div><div class="lab">16</div></div>
    </div>
    <div class="desc">平底=路；两个头肩剪影=两人；一个形。</div>
  </div>

</div>
</body></html>
