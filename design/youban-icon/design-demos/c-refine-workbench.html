<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>游伴 · C 深化第二轮 · V2/V4/V5</title>
<style>
  body{background:#EFE6D9;font-family:-apple-system,"PingFang SC",sans-serif;color:#3D3229;padding:40px;margin:0}
  h1{font-size:20px;margin:0 0 24px}
  .row{display:flex;gap:28px}
  .card{background:#fff;border-radius:16px;padding:20px;flex:1;text-align:center}
  .card h2{font-size:13px;color:#C17F59;margin:0 0 12px;letter-spacing:.1em}
  .big{background:linear-gradient(135deg,#ffffff 0 50%,#FAF7F2 50% 100%);border-radius:12px;display:inline-block;padding:10px}
  .minis{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin-top:14px}
  .mini{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:10px;color:#8B7D6B}
  .chip{background:#fff;box-shadow:inset 0 0 0 1px rgba(92,75,62,.18);border-radius:4px;display:flex;align-items:center;justify-content:center}
  .chip.cream{background:#FAF7F2}
  .chip.dark{background:#35302B}
  .note{font-size:11.5px;color:#5C4B3E;margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<h1>C 深化第四轮(终):V5 / V8 底部加宽 / V8纯对称</h1>

<svg width="0" height="0" style="position:absolute">
  <!-- V5:上轮胜者(肾形+错位) -->
  <symbol id="v5" viewBox="0 0 512 512">
    <path fill="#D4625E" transform="translate(0,7)" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 112,374 146,404 C166,422 198,420 208,400 C220,370 230,260 242,150 Z"/>
    <g transform="translate(512,-7) scale(-1,1)">
      <path fill="#C17F59" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 112,374 146,404 C166,422 198,420 208,400 C220,370 230,260 242,150 Z"/>
    </g>
  </symbol>
  <!-- V8:V5曲线 + 底圆头加宽(138→210),脚下坐稳 + 错位 -->
  <symbol id="v8" viewBox="0 0 512 512">
    <path fill="#D4625E" transform="translate(0,7)" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 108,378 138,406 C160,424 196,422 210,398 C222,368 230,260 242,150 Z"/>
    <g transform="translate(512,-7) scale(-1,1)">
      <path fill="#C17F59" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 108,378 138,406 C160,424 196,422 210,398 C222,368 230,260 242,150 Z"/>
    </g>
  </symbol>
  <!-- V8s:V8 纯对称(无错位) -->
  <symbol id="v8s" viewBox="0 0 512 512">
    <path fill="#D4625E" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 108,378 138,406 C160,424 196,422 210,398 C222,368 230,260 242,150 Z"/>
    <g transform="translate(512,0) scale(-1,1)">
      <path fill="#C17F59" d="M242,150 C244,118 214,94 178,97 C136,102 106,148 100,222 C94,300 108,378 138,406 C160,424 196,422 210,398 C222,368 230,260 242,150 Z"/>
    </g>
  </symbol>
  </svg>

<div class="row">
  <div class="card">
    <h2>V5 · 上轮最佳</h2>
    <div class="big"><svg width="240" height="240"><use href="#v5"/></svg></div>
    <div class="minis">
      <div class="mini"><div class="chip" style="width:32px;height:32px"><svg width="30" height="30"><use href="#v5"/></svg></div>32</div>
      <div class="mini"><div class="chip" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v5"/></svg></div>16</div>
      <div class="mini"><div class="chip cream" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v5"/></svg></div>16奶油</div>
      <div class="mini"><div class="chip dark" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v5"/></svg></div>16暗</div>
    </div>
    <div class="note">肾形+错位:个体感好,但形体底尖头肥</div>
  </div>
  <div class="card">
    <h2>V8 · 底部加宽+错位</h2>
    <div class="big"><svg width="240" height="240"><use href="#v8"/></svg></div>
    <div class="minis">
      <div class="mini"><div class="chip" style="width:32px;height:32px"><svg width="30" height="30"><use href="#v8"/></svg></div>32</div>
      <div class="mini"><div class="chip" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8"/></svg></div>16</div>
      <div class="mini"><div class="chip cream" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8"/></svg></div>16奶油</div>
      <div class="mini"><div class="chip dark" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8"/></svg></div>16暗</div>
    </div>
    <div class="note">V5 曲线不动,仅底圆头 138→210 坐稳</div>
  </div>
  <div class="card">
    <h2>V8s · 底部加宽·纯对称</h2>
    <div class="big"><svg width="240" height="240"><use href="#v8s"/></svg></div>
    <div class="minis">
      <div class="mini"><div class="chip" style="width:32px;height:32px"><svg width="30" height="30"><use href="#v8s"/></svg></div>32</div>
      <div class="mini"><div class="chip" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8s"/></svg></div>16</div>
      <div class="mini"><div class="chip cream" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8s"/></svg></div>16奶油</div>
      <div class="mini"><div class="chip dark" style="width:16px;height:16px"><svg width="16" height="16"><use href="#v8s"/></svg></div>16暗</div>
    </div>
    <div class="note">同 V8 但完全镜像对称 — 更静</div>
  </div>
</div>
</body>
</html>
