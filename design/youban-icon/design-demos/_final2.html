<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"/>
<style>
  body{margin:0;background:#FAF7F2;font-family:"SF Mono",Menlo,monospace;color:#3D3229;padding:30px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:820px;}
  .cell{background:#fffcf5;border:1px solid rgba(92,75,62,.14);border-radius:14px;padding:22px;text-align:center;}
  h3{font-size:12px;margin:0 0 14px;color:#C17F59;letter-spacing:.03em;}
  .big{width:150px;height:150px;margin:0 auto;color:#D4625E;}
  .big svg{width:100%;height:100%;display:block;}
  .row{display:flex;gap:22px;justify-content:center;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(92,75,62,.2);}
  .s16{width:16px;height:16px;color:#D4625E;} .s16 svg{width:100%;height:100%;display:block;}
  .s24{width:24px;height:24px;color:#D4625E;} .s24 svg{width:100%;height:100%;display:block;}
  .s48{width:48px;height:48px;color:#D4625E;} .s48 svg{width:100%;height:100%;display:block;}
  .onwhite{background:#fff;border-radius:6px;padding:2px;}
  .lab{font-size:10px;color:#5C4B3E;margin-top:6px;}
  .tile{width:104px;height:104px;border-radius:24px;background:#D4625E;display:flex;align-items:center;justify-content:center;margin:16px auto 0;box-shadow:0 12px 24px -12px rgba(212,98,94,.5);}
  .tile .m{width:70px;height:70px;color:#fffcf5;} .tile .m svg{width:100%;height:100%;display:block;}
  .desc{font-size:11px;color:#5C4B3E;margin-top:12px;line-height:1.5;}
</style></head><body>
<div class="grid">

  <!-- G1: 单线 棒棒糖圆头两人(闭环成头) -->

      <div><div class="s16"><svg viewBox="0 0 512 512"><path d="M92 330 Q92 322 120 320 L198 316 L202 260 C166 256 166 202 202 190 C238 202 238 256 202 260 L200 316 L296 310 L300 226 C260 222 260 162 300 150 C340 162 340 222 300 226 L298 310 L420 316" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab">16</div></div>
      <div><div class="s16 onwhite"><svg viewBox="0 0 512 512"><path d="M92 330 Q92 322 120 320 L198 316 L202 260 C166 256 166 202 202 190 C238 202 238 256 202 260 L200 316 L296 310 L300 226 C260 222 260 162 300 150 C340 162 340 222 300 226 L298 310 L420 316" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab">16白</div></div>
    </div>
    <div class="tile"><div class="m"><svg viewBox="0 0 512 512"><path d="M92 330 Q92 322 120 320 L198 316 L202 260 C166 256 166 202 202 190 C238 202 238 256 202 260 L200 316 L296 310 L300 226 C260 222 260 162 300 150 C340 162 340 222 300 226 L298 310 L420 316" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <div class="desc">一笔到底：路→升起→闭环成头→回落→路→再一人。圆头=人。</div>
  </div>

    </div>
    <div class="tile"><div class="m"><svg viewBox="0 0 512 512"><path d="M82 334 Q82 318 102 316 L404 304 Q428 303 430 322 Q430 340 408 342 L108 352 Q82 352 82 338 Z" fill="currentColor"/><circle cx="212" cy="232" r="30" fill="currentColor"/><path d="M212 250 C184 250 182 286 184 306 C185 322 190 338 212 338 C234 338 239 322 240 306 C242 286 240 250 212 250 Z" fill="currentColor"/><circle cx="300" cy="204" r="35" fill="currentColor"/><path d="M300 226 C268 226 265 270 267 296 C268 316 274 338 300 338 C326 338 332 316 333 296 C335 270 332 226 300 226 Z" fill="currentColor"/></svg></div></div>

</div>
</body></html>
